name: Build firmware

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 0

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3

      - name: List build artifacts
        shell: bash
        run: |
          set +e
          echo "=== pwd ==="
          pwd
          echo "=== build dir top ==="
          ls -la build/ 2>&1 || echo "NO build/ dir at repo root"
          echo "=== all files under build/ (or repo) ==="
          find build -type f 2>/dev/null | sort | head -100
          echo "=== firmware outputs ==="
          find . \( -name '*.bin' -o -name '*.elf' \) -type f 2>/dev/null | sort | tee build/_firmware_filelist.txt || true
          echo "=== done listing ==="

      - name: Upload diagnostics (branch push)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.ref_name }}
          path: build/
          if-no-files-found: warn

      - name: Upload artifact (branch push)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: passport-${{ github.ref_name }}
          path: |
            build/**/*.bin
            build/*.bin
            build/**/*.elf
            build/*.elf

      - name: Create release (tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: |
            build/**/*.bin
            build/*.bin
            build/**/*.elf
            build/*.elf
