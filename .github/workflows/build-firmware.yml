name: Build firmware

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 0

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3

      - name: List build artifacts
        run: |
          echo "=== build dir top ==="
          ls -la build/
          echo "=== all firmware outputs ==="
          find build \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -type f | sort

      - name: Upload artifact (branch push)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: passport-${{ github.ref_name }}
          path: |
            build/**/*.bin
            build/*.bin
            build/**/*.elf
            build/*.elf

      - name: Create release (tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: |
            build/**/*.bin
            build/*.bin
            build/**/*.elf
            build/*.elf
