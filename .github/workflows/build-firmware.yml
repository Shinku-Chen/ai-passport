name: Build firmware

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 0

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3

      - name: Collect firmware artifacts
        run: |
          ls -la build/
          # 合并 app + bootloader + partition-table 为单 bin，便于烧录
          python "$IDF_PATH/components/esptool_py/esptool/esptool.py" merge_bin \
            -o "build/passport_${GITHUB_REF_NAME//\//-}.bin" \
            @build/flasher_args.json || cp build/FoloToy-AI-Passport.bin build/passport.bin

      - name: Upload artifact (branch push)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: passport-${{ github.ref_name }}
          path: build/*.bin

      - name: Create release (tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: build/*.bin
